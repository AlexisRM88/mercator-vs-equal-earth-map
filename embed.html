<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equal Earth vs. Mercator — Embed Map</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="embed-mode">
    <div class="app-wrapper">
      <!-- Controls Bar -->
      <section class="controls-bar">
        <div class="mode-selectors">
          <button class="mode-btn active" data-mode="split" data-i18n="mode_split">Split Slider (50/50)</button>
          <button class="mode-btn mercator-mode" data-mode="mercator" data-i18n="mode_mercator">Mercator Only (1569)</button>
          <button class="mode-btn equal-mode" data-mode="equal-earth" data-i18n="mode_equal_earth">Equal Earth Only (2026)</button>
          <button class="mode-btn" data-mode="morph" data-i18n="mode_morph">Auto Presentation (Fade)</button>
        </div>

        <div class="aux-toggles">
          <button id="toggle-graticule" class="toggle-chip active">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span data-i18n="toggle_graticules">Grid (15°)</span>
          </button>
          <button id="btn-switch-lang" class="btn-pill" style="padding:0.25rem 0.6rem; font-size:0.75rem;">🌐</button>
        </div>
      </section>

      <!-- Main Map Stage -->
      <main id="map-stage" class="map-stage-card">
        <!-- Floating Labels -->
        <div class="map-legend-bar">
          <div class="legend-badge badge-mercator">
            <span class="dot"></span>
            <span data-i18n="label_mercator_side">MERCATOR (1569)</span>
          </div>
          <div class="legend-badge badge-equal-earth">
            <span class="dot"></span>
            <span data-i18n="label_equal_earth_side">EQUAL EARTH (2026)</span>
          </div>
        </div>

        <!-- SVG Map Container -->
        <div id="map-container" class="map-svg-container"></div>

        <a
          href="./index.html"
          target="_blank"
          rel="noopener"
          class="embed-attribution-watermark"
          title="Open full interactive analysis"
        >
          Equal Earth vs Mercator • UN Res. A/80/L.104 ↗
        </a>
      </main>

      <!-- Compact Distortion Inspector -->
      <section id="distortion-inspector" class="inspector-card" style="padding:0.75rem; margin-bottom:0;"></section>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
